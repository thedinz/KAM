version: "3.9"
services:
  kam:
    image: ghcr.io/thedinz/kam:latest
    container_name: kam
    restart: unless-stopped
    ports:
      - "7171:8000"
    env_file:
      - .env
    environment:
      KOMETA_CONFIG_PATH: /config/config.yml
    volumes:
      - /mnt/user/kometa/assets:/assets:rw
      - /mnt/user/kometa/config:/config:ro
