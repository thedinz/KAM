services:
  kam:
    build: .
    container_name: kam
    ports:
      - "7171:8000"         # host:container — visit http://localhost:7171
    env_file:
      - .env
    volumes:
      # Bind one host root to /assets, then reference subfolders in LIBRARIES
      - /home/thedinz/kometa/config/assets:/assets:rw
    restart: unless-stopped
