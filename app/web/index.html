<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM</title>
<style>
  :root { --bg:#0b0b0f; --fg:#e8e8ee; --muted:#a9a9b5; --card:#15151c; --accent:#5ea1ff; --border:#2a2a36; }
  [data-theme="light"] { --bg:#ffffff; --fg:#11111a; --muted:#4a4a55; --card:#f6f6fb; --accent:#3b82f6; --border:#d7d7e0; }
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg)}
  header{display:flex; gap:12px; align-items:center; padding:14px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5}
  header h1{font-size:18px; margin:0 8px 0 0}
  select,input,button{background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:8px 10px}
  select:focus,input:focus,button:focus{outline:2px solid var(--accent)}
  #themeToggle{cursor:pointer}
  #errors{color:#ff7a7a; min-height:1.2em}
  #toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  #libSelect{min-width:200px}
  #search{min-width:220px}
  #pager{display:flex; gap:6px; align-items:center; margin-left:12px}
  .btn{cursor:pointer}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  #count{color:var(--muted); margin-left:8px}
  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; padding:16px}
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .poster{ width:100%; aspect-ratio:2/3; height:auto; object-fit:contain; background:#222; display:block; }
  .meta{padding:8px 10px}
  .title{font-weight:600; display:grid; grid-template-columns:1fr auto; align-items:start; column-gap:6px; row-gap:4px; min-height:3.4em}
  .title-text{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; line-height:1.2}
  .ready-badge{display:inline-flex; align-items:center; gap:4px; padding:2px 6px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .ready-badge.ready{background:#1f8f4d; color:#fff}
  .ready-badge.not-ready{background:#b91c1c; color:#fff}
  [data-theme="light"] .ready-badge.ready{background:#22c55e; color:#065f46}
  [data-theme="light"] .ready-badge.not-ready{background:#fca5a5; color:#7f1d1d}
  .card[data-ready="false"]{border-color:#532626}
  [data-theme="light"] .card[data-ready="false"]{border-color:#fca5a5}
  .year{color:var(--muted); font-size:13px}
  dialog{border:none; border-radius:14px; padding:0; max-width:520px; width:calc(100% - 24px)}
  .dlg-body{padding:16px}
  .row{display:flex; gap:10px; align-items:center; margin:8px 0}
  .row label{min-width:110px; color:var(--muted)}
  .actions{display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--border)}
  .filebox{display:flex; flex-direction:column; gap:8px; margin:10px 0}
  .hint{color:var(--muted); font-size:13px}
  .small{font-size:12px}
  .muted{color:var(--muted)}
  .tag{display:inline-block; padding:2px 8px; border:1px solid var(--border); border-radius:999px; font-size:12px; color:var(--muted)}
  .row .tag{margin-left:auto}
  .sr{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
</style>
</head>
<body>
<header>
  <h1>KAM</h1>
  <div id="toolbar">
    <select id="libSelect" title="Plex library"></select>
    <input id="search" type="search" placeholder="Search…" />
    <button id="importAllBtn" class="btn" title="Import assets for the whole page">Import Assets</button>
    <div id="pager">
      <button id="firstBtn" class="btn">« First</button>
      <button id="prevBtn" class="btn">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" class="btn">Next ›</button>
      <button id="lastBtn" class="btn">Last »</button>
    </div>
    <span id="count"></span>
    <span id="errors"></span>
  </div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
    <button id="themeToggle" title="Toggle theme">🌓</button>
  </div>
</header>

<main>
  <div id="grid" aria-live="polite"></div>
</main>

<!-- Upload dialog (left intact but no longer opened by clicking items) -->
<dialog id="uploader">
  <form id="uploadForm" method="dialog" enctype="multipart/form-data">
    <div class="dlg-body">
      <h3 style="margin:8px 0 12px">Upload Artwork</h3>
      <div class="row"><label>Library</label><span id="uLibrary" class="tag"></span></div>
      <div class="row"><label>Folder</label><span id="uFolder" class="tag"></span></div>
      <div class="row"><label>Poster</label><input type="file" name="poster" accept="image/*" /></div>
      <div class="row"><label>Background</label><input type="file" name="background" accept="image/*" /></div>
      <p class="hint small">Images will be converted to <code>.jpg</code> and replace existing <code>poster.*</code> or <code>background.*</code> in this folder.</p>
      <p id="uploadStatus" class="muted small"></p>
    </div>
    <div class="actions">
      <button type="button" id="uploadCancel">Cancel</button>
      <button type="submit" id="uploadSubmit" class="btn">Upload</button>
    </div>
  </form>
</dialog>

<script>
  // Theme
  (function(){
    const saved = localStorage.getItem("kam-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
  function toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme") || "dark";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("kam-theme", next);
  }
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  // State
  const grid       = document.getElementById("grid");
  const libSelect  = document.getElementById("libSelect");
  const search     = document.getElementById("search");
  const errors     = document.getElementById("errors");
  const importAllBtn = document.getElementById("importAllBtn");
  const firstBtn = document.getElementById("firstBtn");
  const prevBtn  = document.getElementById("prevBtn");
  const nextBtn  = document.getElementById("nextBtn");
  const lastBtn  = document.getElementById("lastBtn");
  const pageInfo = document.getElementById("pageInfo");
  const countEl  = document.getElementById("count");

  const state = {
    library: null,
    page: 1,
    totalPages: 1,
    pageSize: 60,
    totalCount: 0,
    query: null
  };

  // Utils
  async function j(url){
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  // NEW: determine if an item is a TV show
  function isShowItem(it, libraryName){
    const libTV = (libraryName || '').toLowerCase().includes('tv');
    const t = String(it.type || '').toLowerCase();
    return libTV || t === 'show' || it.isShow === true;
  }

  function goToDetail(it){
    const isCollections = (state.library || '').trim().toLowerCase() === 'collections';
    if (isCollections) return; // unchanged behavior for Collections

    const rk = encodeURIComponent(it.ratingKey || it.key || it.id || '');
    const lib = encodeURIComponent(state.library || '');
    const dest = isShowItem(it, state.library) ? 'show.html' : 'movie.html';
    const url = `${dest}?library=${lib}&ratingKey=${rk}`;
    return url;
  }

  function renderItems(items){
    grid.innerHTML = "";
    for (const it of (items || [])) {
      const card = document.createElement("div");
      card.className = "card";
      const isReady = it?.assetReady !== false;
      card.dataset.ready = isReady ? "true" : "false";
      card.setAttribute("data-ready", card.dataset.ready);

      const img = document.createElement("img");
      img.className = "poster";
      img.loading = "lazy";
      img.alt = esc(it.title || it.name || "Item");

      // favor local, then Plex
      const src = it.posterUrl || it.posterUrlLocal || it.posterUrlPlex || it.thumb || it.background || it.art || "";
      if (src) img.src = src;

      const meta = document.createElement("div");
      meta.className = "meta";

      const t = document.createElement("div");
      t.className = "title";
      const titleText = it.title || it.name || "(Untitled)";
      const titleSpan = document.createElement("span");
      titleSpan.className = "title-text";
      titleSpan.textContent = titleText;
      titleSpan.title = titleText;
      t.appendChild(titleSpan);
      const status = document.createElement("span");
      status.className = `ready-badge ${isReady ? "ready" : "not-ready"}`;
      status.textContent = isReady ? "✔ Ready" : "✖ Not Ready";
      status.title = isReady
        ? "Asset folder found. This item is ready for imports."
        : "Asset folder missing. This item is not ready for imports.";
      t.appendChild(status);

      const y = document.createElement("div");
      y.className = "year";
      const yr = it.year || "";
      y.textContent = yr ? String(yr) : "";

      meta.appendChild(t);
      meta.appendChild(y);

      // CHANGED: click to navigate to dedicated page instead of opening the inline upload dialog
      const detailUrl = goToDetail(it);
      const readinessTooltip = isReady ? "Ready: asset folder found." : "Not ready: asset folder missing.";
      card.title = readinessTooltip;
      if (detailUrl){
        card.style.cursor = "pointer";
        card.title = `${readinessTooltip} Click to open details.`;
        card.addEventListener("click", (ev)=>{
          if (ev.metaKey || ev.ctrlKey) {
            window.open(detailUrl, "_blank");
          } else {
            location.href = detailUrl;
          }
        });
      }

      card.appendChild(img);
      card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  function updatePager(){
    pageInfo.textContent = `Page ${state.page} / ${state.totalPages}`;
    firstBtn.disabled = state.page <= 1;
    prevBtn.disabled  = state.page <= 1;
    nextBtn.disabled  = state.page >= state.totalPages;
    lastBtn.disabled  = state.page >= state.totalPages;
  }

  async function loadPage(p=1){
    if (!state.library) return;
    const isCollections = (state.library || '').trim().toLowerCase() === 'collections';
    const u = new URL(isCollections ? "/collections" : "/api/items", location.origin);
    if (!isCollections) u.searchParams.set("library", state.library);
    u.searchParams.set("page", String(p));
    u.searchParams.set("page_size", String(state.pageSize));
    if (state.query) u.searchParams.set("query", state.query);

    try {
      const data = await j(u.toString());
      state.page = data.page || p || 1;
      state.totalPages = data.total_pages || 1;
      state.totalCount = data.total_count || (data.items ? data.items.length : 0);
      countEl.textContent = `${state.totalCount.toLocaleString()} items`;
      renderItems(data.items || []);
      updatePager();
    } catch (e) {
      errors.textContent = String(e);
    }
  }

  firstBtn.addEventListener("click", ()=> loadPage(1));
  prevBtn.addEventListener("click", ()=> loadPage(Math.max(1, state.page - 1)));
  nextBtn.addEventListener("click", ()=> loadPage(Math.min(state.totalPages, state.page + 1)));
  lastBtn.addEventListener("click", ()=> loadPage(state.totalPages));

  // Import All helpers (unchanged)
  async function fetchAllItemsForLibrary(lib, query=null) {
    const isCollections = (lib || '').trim().toLowerCase() === 'collections';
    const perPage = state.pageSize || 60;
    const mk = (p) => {
      const u = new URL(isCollections ? "/collections" : "/api/items", location.origin);
      if (!isCollections) u.searchParams.set("library", lib);
      u.searchParams.set("page", String(p));
      u.searchParams.set("page_size", String(perPage));
      if (query) u.searchParams.set("query", query);
      return u.toString();
    };
    const all = [];
    const first = await j(mk(1));
    const totalPages = first.total_pages || 1;
    const totalCount = first.total_count || (first.items ? first.items.length : 0);
    all.push(...(first.items || []));
    for (let p = 2; p <= totalPages; p++) {
      const page = await j(mk(p));
      all.push(...(page.items || []));
    }
    return { all, totalPages, totalCount };
  }

  async function importMovieAssets(library, ratingKey, folderName){
    const fd = new FormData();
    fd.append("library", library);
    if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
    if (folderName) fd.append("folderName", folderName);
    return fetch("/api/import/movie", { method: "POST", body: fd });
  }

  async function importCollectionAssets(library, ratingKey, folderName){
    const fd = new FormData();
    fd.append("library", library);
    if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
    if (folderName) fd.append("folderName", folderName);
    return fetch("/api/import/collection", { method: "POST", body: fd });
  }

  async function importShowPosterPreferShowEndpoint(library, ratingKey, folderName){
    const tryShow = async () => {
      const fd = new FormData();
      fd.append("library", library);
      if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
      if (folderName) fd.append("folderName", folderName);
      const r = await fetch("/api/import/show", { method: "POST", body: fd });
      return r;
    };
    let r;
    try {
      r = await tryShow();
      if (!r.ok && r.status !== 404 && r.status !== 405) return r;
      if (r.ok) return r;
    } catch(_) {}
    return importMovieAssets(library, ratingKey, folderName);
  }

  async function importAllSeasons(library, showFolder, seasons){
    for (const s of (seasons || [])) {
      const fs = new FormData();
      fs.append("library", library);
      fs.append("folderName", showFolder);
      fs.append("season", String(s.index));
      await fetch("/api/import/season", { method: "POST", body: fs });
    }
  }

  importAllBtn.addEventListener("click", async ()=>{
    if (!state.library) return;
    importAllBtn.disabled = true;

    const lib = (state.library || "").trim();
    const isCollections = lib.toLowerCase() === "collections";
    const isTVLib = lib.toLowerCase().includes("tv");

    const prevErr = errors.textContent;
    errors.textContent = "Importing assets from Plex… (0%)";

    try {
      const { all } = await fetchAllItemsForLibrary(lib, state.query);
      const allItems = all || [];
      const importable = allItems.filter(it => it?.assetReady !== false);
      const skipCount = allItems.filter(it => it?.assetReady === false).length;

      if (!importable.length) {
        const msg = skipCount
          ? `Nothing to import. ${skipCount} item(s) are missing asset folders.`
          : "Nothing to import.";
        errors.textContent = msg;
        setTimeout(()=>{ errors.textContent = prevErr; }, 3000);
        return;
      }

      let done = 0;
      const total = importable.length;
      const bump = () => {
        done++;
        if (done % 5 === 0 || done === total) {
          const pct = total ? Math.round((done / total) * 100) : 100;
          const skipSuffix = skipCount ? ` – skipping ${skipCount} not-ready item(s)` : "";
          errors.textContent = `Importing assets from Plex… (${pct}%)${skipSuffix}`;
        }
      };

      if (skipCount) {
        errors.textContent = `Importing assets from Plex… (0%) – skipping ${skipCount} not-ready item(s)`;
      }

      for (const it of importable) {
        const folderName = it.folderName || it.folder || it.name || it.title || "";
        const ratingKey = it.ratingKey || it.key || it.id;

        if (isCollections) {
          await importCollectionAssets(lib, ratingKey, folderName);
          bump();
          continue;
        }

        if (isTVLib || String(it.type || "").toLowerCase() === "show" || it.isShow === true) {
          try {
            const show = await j(`/api/show?library=${encodeURIComponent(lib)}&ratingKey=${encodeURIComponent(ratingKey)}`);
            const showFolder = show.folderName || folderName;
            await importShowPosterPreferShowEndpoint(lib, ratingKey, showFolder);
            await importAllSeasons(lib, showFolder, show.seasons || []);
          } catch (e) {
            await importMovieAssets(lib, ratingKey, folderName);
          }
        } else {
          await importMovieAssets(lib, ratingKey, folderName);
        }

        bump();
      }

      const doneMsg = skipCount
        ? `Import complete. Skipped ${skipCount} item(s) missing asset folders.`
        : "Import complete.";
      errors.textContent = doneMsg;
      await loadPage(state.page);
      setTimeout(()=>{ errors.textContent = ""; }, 1500);
    } catch (e) {
      errors.textContent = "Import failed: " + (e?.message || e);
      setTimeout(()=>{ errors.textContent = prevErr; }, 3000);
    } finally {
      importAllBtn.disabled = false;
    }
  });

  // library + search
  function updateImportAllBtnState(){
    const lib = (state.library || '').trim();
    const isCollections = lib.toLowerCase() === 'collections';
    if (importAllBtn) {
      importAllBtn.disabled = !lib;
      importAllBtn.title = isCollections
        ? "Import all collection posters/backgrounds from Plex into Kometa asset folders"
        : "Import all posters/backgrounds (and TV seasons) from Plex into Kometa asset folders";
    }
  }

  async function init(){
    const urlp = new URLSearchParams(location.search);
    const desiredLib = urlp.get('lib');
    try {
      const libs = await fetchLibraries();
      libSelect.innerHTML = "";
      for (const name of libs) {
        const opt = document.createElement("option");
        opt.value = opt.textContent = name;
        libSelect.appendChild(opt);
      }
      try {
        const ping = await fetch("/collections?page=1&page_size=1");
        if (ping.ok && !libs.includes("Collections")) {
          const opt = document.createElement("option");
          opt.value = opt.textContent = "Collections";
          libSelect.appendChild(opt);
          libs.push("Collections");
        }
      } catch (_) {}
      if (libs.length) {
        if (desiredLib && libs.includes(desiredLib)) {
          state.library = desiredLib;
        } else if (!state.library) {
          state.library = libs[0];
        }
        libSelect.value = state.library;
        state.page = 1;
        updateImportAllBtnState();
        await loadPage(1);
      }
    } catch (e) {
      errors.textContent = String(e);
    }
  }
  libSelect.addEventListener("change", async ()=>{
    state.library = libSelect.value;
    state.page = 1;
    updateImportAllBtnState();
    await loadPage(1);
  });

  async function fetchLibraries(){
    const data = await j("/api/libraries");
    return data.libraries || data || [];
  }

  let searchTimer = null;
  search.addEventListener("input", ()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      const val = search.value.trim();
      state.query = val || null;
      state.page = 1;
      loadPage(1);
    }, 300);
  });

  // Upload dialog code left as-is (no longer invoked by clicking cards)
  const dlg = document.getElementById("uploader");
  const uploadForm = document.getElementById("uploadForm");
  const uploadStatus = document.getElementById("uploadStatus");
  window.closeUploadDialog = () => dlg.close();

  document.getElementById("uploadCancel").addEventListener("click", ()=> dlg.close());
  uploadForm.addEventListener("submit", async (ev)=>{
    ev.preventDefault();
    uploadStatus.textContent = "Uploading…";
    const fd = new FormData(uploadForm);
    try {
      const p = fd.get("poster");
      if (p && p.size > 0) {
        const up = new FormData();
        up.append("library", state.library);
        up.append("folderName", fd.get("folderName") || "");
        up.append("file", p);
        await fetch("/api/upload/poster", { method: "POST", body: up });
      }
      const b = fd.get("background");
      if (b && b.size > 0) {
        const up = new FormData();
        up.append("library", state.library);
        up.append("folderName", fd.get("folderName") || "");
        up.append("file", b);
        await fetch("/api/upload/background", { method: "POST", body: up });
      }
      uploadStatus.textContent = "Done.";
      setTimeout(()=> dlg.close(), 600);
      await loadPage(state.page);
    } catch (e) {
      uploadStatus.textContent = "Upload failed: " + (e?.message || e);
    }
  });

  // boot
  init();
</script>
</body>
</html>
