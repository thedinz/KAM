<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM</title>
<style>
  :root { --bg:#0b0b0f; --fg:#e8e8ee; --muted:#a9a9b5; --card:#15151c; --accent:#5ea1ff; --border:#2a2a36; }
  [data-theme="light"] { --bg:#ffffff; --fg:#11111a; --muted:#4a4a55; --card:#f6f6fb; --accent:#3b82f6; --border:#d7d7e0; }
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg)}
  header{display:flex; gap:12px; align-items:center; padding:14px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5}
  header h1{font-size:18px; margin:0 8px 0 0}
  select,input,button{background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:8px 10px}
  select:focus,input:focus,button:focus{outline:2px solid var(--accent)}
  #themeToggle{cursor:pointer}
  .import-status{display:none; flex-direction:column; gap:6px; min-width:220px; max-width:340px; color:var(--muted); align-items:flex-start}
  .import-status.is-active{display:flex}
  .import-status .progress-wrapper{display:flex; flex-direction:column; gap:4px}
  .import-status .progress-track{position:relative; width:100%; height:8px; background:var(--border); border-radius:999px; overflow:hidden}
  .import-status .progress-bar{position:absolute; inset:0; width:0%; background:var(--accent); transition:width .25s ease}
  .import-status .progress-label{font-size:13px; line-height:1.4}
  .import-status .error-list{margin:0; padding-left:18px; font-size:13px; line-height:1.4; color:#ff7a7a; display:none}
  .import-status.has-errors .error-list{display:block}
  .import-status.has-errors .progress-label{color:#ffb4b4}
  #toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  #libSelect{min-width:200px}
  #search{min-width:220px}
  #pager{display:flex; gap:6px; align-items:center; margin-left:12px}
  .btn{cursor:pointer}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  #count{color:var(--muted); margin-left:8px}
  #grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; padding:16px}
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .poster{ width:100%; aspect-ratio:2/3; height:auto; object-fit:contain; background:#222; display:block; }
  .meta{padding:8px 10px}
  .title{font-weight:600; display:grid; grid-template-columns:1fr auto; align-items:start; column-gap:6px; row-gap:4px; min-height:3.4em}
  .title-text{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; line-height:1.2}
  .ready-badge{display:inline-flex; align-items:center; gap:4px; padding:2px 6px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .ready-badge.ready{background:#1f8f4d; color:#fff}
  .ready-badge.not-ready{background:#b91c1c; color:#fff}
  [data-theme="light"] .ready-badge.ready{background:#22c55e; color:#065f46}
  [data-theme="light"] .ready-badge.not-ready{background:#fca5a5; color:#7f1d1d}
  .card[data-ready="false"]{border-color:#532626}
  [data-theme="light"] .card[data-ready="false"]{border-color:#fca5a5}
  .year{color:var(--muted); font-size:13px}
  dialog{border:none; border-radius:14px; padding:0; max-width:520px; width:calc(100% - 24px)}
  .dlg-body{padding:16px}
  .row{display:flex; gap:10px; align-items:center; margin:8px 0}
  .row label{min-width:110px; color:var(--muted)}
  .actions{display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:10px 16px; border-top:1px solid var(--border)}
  .filebox{display:flex; flex-direction:column; gap:8px; margin:10px 0}
  .hint{color:var(--muted); font-size:13px}
  .small{font-size:12px}
  .muted{color:var(--muted)}
  .tag{display:inline-block; padding:2px 8px; border:1px solid var(--border); border-radius:999px; font-size:12px; color:var(--muted)}
  .row .tag{margin-left:auto}
  .sr{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
</style>
</head>
<body>
<header>
  <h1>KAM</h1>
  <div id="toolbar">
    <select id="libSelect" title="Plex library"></select>
    <input id="search" type="search" placeholder="Search…" />
    <button id="importAllBtn" class="btn" title="Import assets for the whole page">Import Assets</button>
    <div id="pager">
      <button id="firstBtn" class="btn">« First</button>
      <button id="prevBtn" class="btn">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="nextBtn" class="btn">Next ›</button>
      <button id="lastBtn" class="btn">Last »</button>
    </div>
    <span id="count"></span>
    <div id="importStatus" class="import-status" aria-live="polite">
      <div class="progress-wrapper">
        <div class="progress-track"><div class="progress-bar"></div></div>
        <span class="progress-label"></span>
      </div>
      <ul class="error-list"></ul>
    </div>
  </div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
    <button id="themeToggle" title="Toggle theme">🌓</button>
  </div>
</header>

<main>
  <div id="grid" aria-live="polite"></div>
</main>

<!-- Upload dialog (left intact but no longer opened by clicking items) -->
<dialog id="uploader">
  <form id="uploadForm" method="dialog" enctype="multipart/form-data">
    <div class="dlg-body">
      <h3 style="margin:8px 0 12px">Upload Artwork</h3>
      <div class="row"><label>Library</label><span id="uLibrary" class="tag"></span></div>
      <div class="row"><label>Folder</label><span id="uFolder" class="tag"></span></div>
      <div class="row"><label>Poster</label><input type="file" name="poster" accept="image/*" /></div>
      <div class="row"><label>Background</label><input type="file" name="background" accept="image/*" /></div>
      <p class="hint small">Images will be converted to <code>.jpg</code> and replace existing <code>poster.*</code> or <code>background.*</code> in this folder.</p>
      <p id="uploadStatus" class="muted small"></p>
    </div>
    <div class="actions">
      <button type="button" id="uploadCancel">Cancel</button>
      <button type="submit" id="uploadSubmit" class="btn">Upload</button>
    </div>
  </form>
</dialog>

<script>
  // Theme
  (function(){
    const saved = localStorage.getItem("kam-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
  function toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme") || "dark";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("kam-theme", next);
  }
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  // State
  const grid       = document.getElementById("grid");
  const libSelect  = document.getElementById("libSelect");
  const search     = document.getElementById("search");
  const importAllBtn = document.getElementById("importAllBtn");
  const importStatus = document.getElementById("importStatus");
  const progressBar = importStatus ? importStatus.querySelector(".progress-bar") : null;
  const progressLabel = importStatus ? importStatus.querySelector(".progress-label") : null;
  const errorListEl = importStatus ? importStatus.querySelector(".error-list") : null;
  const firstBtn = document.getElementById("firstBtn");
  const prevBtn  = document.getElementById("prevBtn");
  const nextBtn  = document.getElementById("nextBtn");
  const lastBtn  = document.getElementById("lastBtn");
  const pageInfo = document.getElementById("pageInfo");
  const countEl  = document.getElementById("count");

  const state = {
    library: null,
    page: 1,
    totalPages: 1,
    pageSize: 60,
    totalCount: 0,
    query: null
  };

  // Progress helpers
  let progressHideTimer = null;

  function showProgressContainer(){
    clearTimeout(progressHideTimer);
    if (!importStatus) return;
    importStatus.classList.add("is-active");
  }

  function hideProgressContainer(){
    clearTimeout(progressHideTimer);
    if (!importStatus) return;
    importStatus.classList.remove("is-active");
    importStatus.classList.remove("has-errors");
  }

  function renderErrorList(items){
    const hasErrors = Array.isArray(items) && items.length > 0;
    if (importStatus) {
      importStatus.classList.toggle("has-errors", hasErrors);
    }
    if (!errorListEl) return;
    errorListEl.innerHTML = "";
    if (!hasErrors) return;
    for (const entry of items) {
      const li = document.createElement("li");
      const parts = [];
      if (entry.library) parts.push(`[${entry.library}]`);
      if (entry.title) parts.push(entry.title);
      if (entry.folder && entry.folder !== entry.title) parts.push(`(${entry.folder})`);
      let text = parts.join(" ");
      if (entry.asset) text = text ? `${text} – ${entry.asset}` : entry.asset;
      if (entry.message) text = text ? `${text}: ${entry.message}` : entry.message;
      li.textContent = text || "Unknown issue";
      errorListEl.appendChild(li);
    }
  }

  function resetProgressUI(){
    if (progressBar) progressBar.style.width = "0%";
    if (progressLabel) progressLabel.textContent = "";
    renderErrorList([]);
  }

  function updateProgressUI(percent, label){
    if (typeof percent === "number" && !Number.isNaN(percent)) {
      const clamped = Math.max(0, Math.min(100, Math.round(percent)));
      if (progressBar) progressBar.style.width = `${clamped}%`;
    }
    if (label !== undefined) {
      if (progressLabel) progressLabel.textContent = label || "";
    }
  }

  function scheduleProgressHide(delay = 2500){
    clearTimeout(progressHideTimer);
    progressHideTimer = setTimeout(()=>{
      hideProgressContainer();
      resetProgressUI();
    }, delay);
  }

  function flashStatusMessage(text, delay = 3000){
    showProgressContainer();
    resetProgressUI();
    updateProgressUI(0, text);
    scheduleProgressHide(delay);
  }

  function pushFailureEntry(list, context, asset, message){
    list.push({
      library: context.library || "",
      title: context.title || "",
      folder: context.folder || "",
      asset,
      message: message || "Unknown error"
    });
  }

  function collectResultFailures(list, context, result){
    if (!result) return;
    const hasPoster = result.poster && typeof result.poster === "object";
    const hasBackground = result.background && typeof result.background === "object";
    const seasons = Array.isArray(result.seasons) ? result.seasons : [];
    if (hasPoster && !result.poster.ok) {
      pushFailureEntry(list, context, "Poster", result.poster.error || "Failed to import poster");
    }
    if (hasBackground && !result.background.ok) {
      pushFailureEntry(list, context, "Background", result.background.error || "Failed to import background");
    }
    for (const sea of seasons) {
      if (sea && sea.ok) continue;
      const idx = sea && sea.index;
      let label = "Season";
      if (idx !== undefined && idx !== null) {
        const idxNum = Number(idx);
        if (Number.isFinite(idxNum)) {
          label = `Season ${String(idxNum).padStart(2, "0")}`;
        } else {
          label = `Season ${idx}`;
        }
      }
      pushFailureEntry(list, context, label, (sea && sea.error) || "Failed to import season poster");
    }
    if (!result.ok) {
      const hasSpecific = (
        (hasPoster && result.poster && result.poster.error)
        || (hasBackground && result.background && result.background.error)
        || seasons.some(sea => sea && (!sea.ok || sea.error))
      );
      if (!hasSpecific && result.error) {
        pushFailureEntry(list, context, "Import", result.error);
      }
    }
  }

  // Utils
  async function j(url){
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }
  async function safeJson(response){
    try {
      return await response.json();
    } catch (_) {
      return null;
    }
  }
  function responseErrorMessage(response, data){
    if (!response) return "Unknown error";
    return (
      (data && (data.detail || data.error || data.message))
      || `${response.status} ${response.statusText}`
    );
  }
  function normalizeAssetResult(part, fallbackError=null){
    return {
      ok: Boolean(part && part.ok),
      path: part && part.path || null,
      src: part && part.src || null,
      error: (part && part.error) || fallbackError || null
    };
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  // NEW: determine if an item is a TV show
  function isShowItem(it, libraryName){
    const libTV = (libraryName || '').toLowerCase().includes('tv');
    const t = String(it.type || '').toLowerCase();
    return libTV || t === 'show' || it.isShow === true;
  }

  function goToDetail(it){
    const isCollections = (state.library || '').trim().toLowerCase() === 'collections';
    if (isCollections) return; // unchanged behavior for Collections

    const rk = encodeURIComponent(it.ratingKey || it.key || it.id || '');
    const lib = encodeURIComponent(state.library || '');
    const dest = isShowItem(it, state.library) ? 'show.html' : 'movie.html';
    const url = `${dest}?library=${lib}&ratingKey=${rk}`;
    return url;
  }

  function renderItems(items){
    grid.innerHTML = "";
    for (const it of (items || [])) {
      const card = document.createElement("div");
      card.className = "card";
      const isReady = it?.assetReady !== false;
      card.dataset.ready = isReady ? "true" : "false";
      card.setAttribute("data-ready", card.dataset.ready);

      const img = document.createElement("img");
      img.className = "poster";
      img.loading = "lazy";
      img.alt = esc(it.title || it.name || "Item");

      // favor local, then Plex
      const src = it.posterUrl || it.posterUrlLocal || it.posterUrlPlex || it.thumb || it.background || it.art || "";
      if (src) img.src = src;

      const meta = document.createElement("div");
      meta.className = "meta";

      const t = document.createElement("div");
      t.className = "title";
      const titleText = it.title || it.name || "(Untitled)";
      const titleSpan = document.createElement("span");
      titleSpan.className = "title-text";
      titleSpan.textContent = titleText;
      titleSpan.title = titleText;
      t.appendChild(titleSpan);
      const status = document.createElement("span");
      status.className = `ready-badge ${isReady ? "ready" : "not-ready"}`;
      status.textContent = isReady ? "✔ Ready" : "✖ Not Ready";
      status.title = isReady
        ? "Asset folder found. This item is ready for imports."
        : "Asset folder missing. This item is not ready for imports.";
      t.appendChild(status);

      const y = document.createElement("div");
      y.className = "year";
      const yr = it.year || "";
      y.textContent = yr ? String(yr) : "";

      meta.appendChild(t);
      meta.appendChild(y);

      // CHANGED: click to navigate to dedicated page instead of opening the inline upload dialog
      const detailUrl = goToDetail(it);
      const readinessTooltip = isReady ? "Ready: asset folder found." : "Not ready: asset folder missing.";
      card.title = readinessTooltip;
      if (detailUrl){
        card.style.cursor = "pointer";
        card.title = `${readinessTooltip} Click to open details.`;
        card.addEventListener("click", (ev)=>{
          if (ev.metaKey || ev.ctrlKey) {
            window.open(detailUrl, "_blank");
          } else {
            location.href = detailUrl;
          }
        });
      }

      card.appendChild(img);
      card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  function updatePager(){
    pageInfo.textContent = `Page ${state.page} / ${state.totalPages}`;
    firstBtn.disabled = state.page <= 1;
    prevBtn.disabled  = state.page <= 1;
    nextBtn.disabled  = state.page >= state.totalPages;
    lastBtn.disabled  = state.page >= state.totalPages;
  }

  async function loadPage(p=1){
    if (!state.library) return;
    const isCollections = (state.library || '').trim().toLowerCase() === 'collections';
    const u = new URL(isCollections ? "/collections" : "/api/items", location.origin);
    if (!isCollections) u.searchParams.set("library", state.library);
    u.searchParams.set("page", String(p));
    u.searchParams.set("page_size", String(state.pageSize));
    if (state.query) u.searchParams.set("query", state.query);

    try {
      const data = await j(u.toString());
      state.page = data.page || p || 1;
      state.totalPages = data.total_pages || 1;
      state.totalCount = data.total_count || (data.items ? data.items.length : 0);
      countEl.textContent = `${state.totalCount.toLocaleString()} items`;
      renderItems(data.items || []);
      updatePager();
    } catch (e) {
      flashStatusMessage(String(e));
    }
  }

  firstBtn.addEventListener("click", ()=> loadPage(1));
  prevBtn.addEventListener("click", ()=> loadPage(Math.max(1, state.page - 1)));
  nextBtn.addEventListener("click", ()=> loadPage(Math.min(state.totalPages, state.page + 1)));
  lastBtn.addEventListener("click", ()=> loadPage(state.totalPages));

  // Import All helpers (unchanged)
  async function fetchAllItemsForLibrary(lib, query=null) {
    const isCollections = (lib || '').trim().toLowerCase() === 'collections';
    const perPage = state.pageSize || 60;
    const mk = (p) => {
      const u = new URL(isCollections ? "/collections" : "/api/items", location.origin);
      if (!isCollections) u.searchParams.set("library", lib);
      u.searchParams.set("page", String(p));
      u.searchParams.set("page_size", String(perPage));
      if (query) u.searchParams.set("query", query);
      return u.toString();
    };
    const all = [];
    const first = await j(mk(1));
    const totalPages = first.total_pages || 1;
    const totalCount = first.total_count || (first.items ? first.items.length : 0);
    all.push(...(first.items || []));
    for (let p = 2; p <= totalPages; p++) {
      const page = await j(mk(p));
      all.push(...(page.items || []));
    }
    return { all, totalPages, totalCount };
  }

  async function importMovieAssets(library, ratingKey, folderName){
    const fd = new FormData();
    fd.append("library", library);
    if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
    if (folderName) fd.append("folderName", folderName);
    try {
      const response = await fetch("/api/import/movie", { method: "POST", body: fd });
      const data = await safeJson(response);
      const results = data && (data.results || data) || {};
      const message = response.ok ? null : responseErrorMessage(response, data);
      const poster = normalizeAssetResult(results.poster, message);
      const background = normalizeAssetResult(results.background, message);
      const ok = Boolean(
        (data && typeof data.ok === "boolean" ? data.ok : null) ?? poster.ok || background.ok
      );
      return {
        ok: ok && response.ok,
        poster,
        background,
        seasons: [],
        error: message || (data && data.error) || null,
        endpoint: "movie"
      };
    } catch (err) {
      const message = err?.message || String(err);
      return {
        ok: false,
        poster: normalizeAssetResult(null, message),
        background: normalizeAssetResult(null, message),
        seasons: [],
        error: message,
        endpoint: "movie"
      };
    }
  }

  async function importCollectionAssets(library, ratingKey, folderName){
    const fd = new FormData();
    fd.append("library", library);
    if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
    if (folderName) fd.append("folderName", folderName);
    try {
      const response = await fetch("/api/import/collection", { method: "POST", body: fd });
      const data = await safeJson(response);
      const results = data && (data.results || data) || {};
      const message = response.ok ? null : responseErrorMessage(response, data);
      const poster = normalizeAssetResult(results.poster, message);
      const background = normalizeAssetResult(results.background, message);
      const ok = Boolean(
        (data && typeof data.ok === "boolean" ? data.ok : null) ?? poster.ok || background.ok
      );
      return {
        ok: ok && response.ok,
        poster,
        background,
        seasons: [],
        error: message || (data && data.error) || null,
        endpoint: "collection"
      };
    } catch (err) {
      const message = err?.message || String(err);
      return {
        ok: false,
        poster: normalizeAssetResult(null, message),
        background: normalizeAssetResult(null, message),
        seasons: [],
        error: message,
        endpoint: "collection"
      };
    }
  }

  async function importShowPosterPreferShowEndpoint(library, ratingKey, folderName){
    const fd = new FormData();
    fd.append("library", library);
    if (ratingKey != null) fd.append("ratingKey", String(ratingKey));
    if (folderName) fd.append("folderName", folderName);
    try {
      const response = await fetch("/api/import/show", { method: "POST", body: fd });
      const data = await safeJson(response);
      const message = response.ok ? null : responseErrorMessage(response, data);
      const poster = normalizeAssetResult(data && data.poster, message);
      const background = normalizeAssetResult(data && data.background, message);
      const seasonsRaw = Array.isArray(data && data.seasons) ? data.seasons : [];
      const seasons = seasonsRaw.map(s => ({
        ok: Boolean(s && s.ok),
        index: s && (s.index ?? s.season ?? s.number ?? null),
        path: s && s.path || null,
        src: s && s.src || null,
        error: s && s.error || null
      }));
      const ok = Boolean(
        (data && typeof data.ok === "boolean" ? data.ok : null)
          ?? poster.ok
          || background.ok
          || seasons.some(sea => sea.ok)
      );
      const result = {
        ok: ok && response.ok,
        poster,
        background,
        seasons,
        error: message || (data && data.error) || null,
        endpoint: "show"
      };
      if (response.ok) return result;
      if (response.status === 404 || response.status === 405) {
        const fallback = await importMovieAssets(library, ratingKey, folderName);
        fallback.fallbackReason = message;
        return fallback;
      }
      return result;
    } catch (err) {
      const fallback = await importMovieAssets(library, ratingKey, folderName);
      const message = err?.message || String(err);
      fallback.fallbackReason = message;
      return fallback;
    }
  }

  async function importAllSeasons(library, showFolder, seasons, ratingKey){
    const results = [];
    let anyOk = false;
    for (const s of (seasons || [])) {
      const idxRaw = s && (s.index ?? s.season ?? s.number ?? null);
      const entry = { ok: false, index: idxRaw ?? null, path: null, src: null, error: null };
      const idx = Number(idxRaw);
      if (!Number.isFinite(idx)) {
        entry.error = `Invalid season index: ${idxRaw}`;
        results.push(entry);
        continue;
      }
      const fs = new FormData();
      fs.append("library", library);
      if (showFolder) fs.append("folderName", showFolder);
      fs.append("season", String(idx));
      if (ratingKey != null) fs.append("ratingKey", String(ratingKey));
      try {
        const response = await fetch("/api/import/season", { method: "POST", body: fs });
        const data = await safeJson(response);
        if (!response.ok) {
          entry.error = responseErrorMessage(response, data);
        } else {
          entry.ok = Boolean(
            (data && typeof data.ok === "boolean" ? data.ok : null) ?? response.ok
          );
          entry.path = data && data.path || null;
          entry.src = data && data.src || null;
          if (!entry.ok) entry.error = data && data.error || null;
        }
      } catch (err) {
        entry.error = err?.message || String(err);
      }
      if (!entry.error && !entry.ok) entry.error = "Unknown error";
      if (entry.ok) anyOk = true;
      results.push(entry);
    }
    return { ok: anyOk, seasons: results, endpoint: "season" };
  }

  importAllBtn.addEventListener("click", async ()=>{
    if (!state.library) return;
    importAllBtn.disabled = true;

    const lib = (state.library || "").trim();
    const isCollections = lib.toLowerCase() === "collections";
    const isTVLib = lib.toLowerCase().includes("tv");
    const failures = [];

    showProgressContainer();
    resetProgressUI();
    updateProgressUI(0, "Preparing import…");

    try {
      const { all } = await fetchAllItemsForLibrary(lib, state.query);
      const allItems = Array.isArray(all) ? all : [];
      const importable = allItems.filter(it => it?.assetReady !== false);
      const skippedItems = allItems.filter(it => it?.assetReady === false);

      for (const skip of skippedItems) {
        const context = {
          library: lib,
          title: skip?.title || skip?.name || "(Untitled)",
          folder: skip?.folderName || skip?.folder || skip?.name || skip?.title || ""
        };
        pushFailureEntry(failures, context, "Item", "Skipped (asset folder missing)");
      }

      if (!importable.length) {
        if (failures.length) {
          const count = failures.length;
          updateProgressUI(0, `Import skipped. ${count} item${count === 1 ? "" : "s"} missing asset folders.`);
          renderErrorList(failures);
        } else {
          updateProgressUI(0, "Nothing to import.");
          renderErrorList([]);
          scheduleProgressHide(2000);
        }
        return;
      }

      let processed = 0;
      const total = importable.length;
      const skipSuffix = skippedItems.length
        ? ` (skipping ${skippedItems.length} not-ready item${skippedItems.length === 1 ? "" : "s"})`
        : "";
      const updateLabel = () => {
        const pct = total ? (processed / total) * 100 : 100;
        updateProgressUI(pct, `Importing assets from Plex… ${processed}/${total}${skipSuffix}`);
      };

      updateLabel();

      for (const it of importable) {
        const title = it?.title || it?.name || "(Untitled)";
        const folderName = it?.folderName || it?.folder || it?.name || it?.title || "";
        const ratingKey = it?.ratingKey || it?.key || it?.id;
        const context = { library: lib, title, folder: folderName };

        try {
          if (isCollections) {
            const result = await importCollectionAssets(lib, ratingKey, folderName);
            collectResultFailures(failures, context, result);
          } else if (isTVLib || isShowItem(it, lib)) {
            let showData = null;
            if (ratingKey != null) {
              try {
                const url = `/api/show?library=${encodeURIComponent(lib)}&ratingKey=${encodeURIComponent(ratingKey)}`;
                showData = await j(url);
              } catch (err) {
                pushFailureEntry(failures, context, "Show Lookup", err?.message || String(err));
              }
            }
            const showFolder = showData?.folderName || folderName;
            const seasonsMeta = Array.isArray(showData?.seasons) ? showData.seasons : [];
            const showResult = await importShowPosterPreferShowEndpoint(lib, ratingKey, showFolder);
            collectResultFailures(failures, context, showResult);
            const hasSeasonResults = Array.isArray(showResult.seasons) && showResult.seasons.length > 0;
            if (!hasSeasonResults && seasonsMeta.length) {
              const seasonResult = await importAllSeasons(lib, showFolder, seasonsMeta, ratingKey);
              collectResultFailures(failures, context, seasonResult);
            }
          } else {
            const result = await importMovieAssets(lib, ratingKey, folderName);
            collectResultFailures(failures, context, result);
          }
        } catch (err) {
          pushFailureEntry(failures, context, "Import", err?.message || String(err));
        }

        processed += 1;
        updateLabel();
      }

      await loadPage(state.page);

      const failureCount = failures.length;
      if (failureCount) {
        showProgressContainer();
        updateProgressUI(100, `Import completed with ${failureCount} failure${failureCount === 1 ? "" : "s"}.`);
        renderErrorList(failures);
      } else {
        showProgressContainer();
        updateProgressUI(100, "Import complete.");
        renderErrorList([]);
        scheduleProgressHide(2500);
      }
    } catch (e) {
      const message = `Import failed: ${e?.message || e}`;
      pushFailureEntry(failures, { library: lib, title: "", folder: "" }, "Import", message);
      showProgressContainer();
      updateProgressUI(0, message);
      renderErrorList(failures);
    } finally {
      importAllBtn.disabled = false;
    }
  });

  // library + search
  function updateImportAllBtnState(){
    const lib = (state.library || '').trim();
    const isCollections = lib.toLowerCase() === 'collections';
    if (importAllBtn) {
      importAllBtn.disabled = !lib;
      importAllBtn.title = isCollections
        ? "Import all collection posters/backgrounds from Plex into Kometa asset folders"
        : "Import all posters/backgrounds (and TV seasons) from Plex into Kometa asset folders";
    }
  }

  async function init(){
    const urlp = new URLSearchParams(location.search);
    const desiredLib = urlp.get('lib');
    try {
      const libs = await fetchLibraries();
      libSelect.innerHTML = "";
      for (const name of libs) {
        const opt = document.createElement("option");
        opt.value = opt.textContent = name;
        libSelect.appendChild(opt);
      }
      try {
        const ping = await fetch("/collections?page=1&page_size=1");
        if (ping.ok && !libs.includes("Collections")) {
          const opt = document.createElement("option");
          opt.value = opt.textContent = "Collections";
          libSelect.appendChild(opt);
          libs.push("Collections");
        }
      } catch (_) {}
      if (libs.length) {
        if (desiredLib && libs.includes(desiredLib)) {
          state.library = desiredLib;
        } else if (!state.library) {
          state.library = libs[0];
        }
        libSelect.value = state.library;
        state.page = 1;
        updateImportAllBtnState();
        await loadPage(1);
      }
    } catch (e) {
      flashStatusMessage(String(e));
    }
  }
  libSelect.addEventListener("change", async ()=>{
    state.library = libSelect.value;
    state.page = 1;
    updateImportAllBtnState();
    await loadPage(1);
  });

  async function fetchLibraries(){
    const data = await j("/api/libraries");
    return data.libraries || data || [];
  }

  let searchTimer = null;
  search.addEventListener("input", ()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      const val = search.value.trim();
      state.query = val || null;
      state.page = 1;
      loadPage(1);
    }, 300);
  });

  // Upload dialog code left as-is (no longer invoked by clicking cards)
  const dlg = document.getElementById("uploader");
  const uploadForm = document.getElementById("uploadForm");
  const uploadStatus = document.getElementById("uploadStatus");
  window.closeUploadDialog = () => dlg.close();

  document.getElementById("uploadCancel").addEventListener("click", ()=> dlg.close());
  uploadForm.addEventListener("submit", async (ev)=>{
    ev.preventDefault();
    uploadStatus.textContent = "Uploading…";
    const fd = new FormData(uploadForm);
    try {
      const p = fd.get("poster");
      if (p && p.size > 0) {
        const up = new FormData();
        up.append("library", state.library);
        up.append("folderName", fd.get("folderName") || "");
        up.append("file", p);
        await fetch("/api/upload/poster", { method: "POST", body: up });
      }
      const b = fd.get("background");
      if (b && b.size > 0) {
        const up = new FormData();
        up.append("library", state.library);
        up.append("folderName", fd.get("folderName") || "");
        up.append("file", b);
        await fetch("/api/upload/background", { method: "POST", body: up });
      }
      uploadStatus.textContent = "Done.";
      setTimeout(()=> dlg.close(), 600);
      await loadPage(state.page);
    } catch (e) {
      uploadStatus.textContent = "Upload failed: " + (e?.message || e);
    }
  });

  // boot
  init();
</script>
</body>
</html>
