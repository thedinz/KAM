<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM • Show</title>
<style>
  :root { --bg:#0b0b0f; --fg:#e8e8ee; --muted:#a9a9b5; --card:#15151c; --accent:#5ea1ff; --border:#2a2a36; }
  [data-theme="light"] { --bg:#ffffff; --fg:#11111a; --muted:#4a4a55; --card:#f6f6fb; --accent:#3b82f6; --border:#d7d7e0; }
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg)}
  header{display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5}
  header h1{font-size:18px; margin:0 8px 0 0}
  a.btn,button.btn{background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:8px 10px; text-decoration:none; cursor:pointer}
  a.btn:hover,button.btn:hover{border-color:var(--accent)}
  main{padding:16px}
  .row{display:flex; gap:16px; flex-wrap:wrap}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; overflow:hidden;}
  .label{font-size:13px; color:var(--muted); margin-bottom:6px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; margin-top:12px}
  .exists{font-size:12px; color:#4ade80; margin-left:6px}
  .missing{font-size:12px; color:#f59e0b; margin-left:6px}
  .upload-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .upload-row input[type="file"]{flex:1}
  #status{margin-top:10px; color:var(--muted)}
</style>
</head>
<body>
<header>
  <a id="back" class="btn" href="index.html">← Back</a>
  <h1 id="title">Show</h1>
</header>
<main>
  <div class="row">
    <div class="card">
      <div class="label">Series Poster</div>
      <img id="posterImg" style="max-height:220px; border-radius:8px; display:none; margin-bottom:8px" />
      <div class="upload-row">
        <input type="file" id="posterFile" accept="image/*">
        <button class="btn" id="importPoster">Import</button>
        <button class="btn" id="uploadPoster">Upload</button>
        <span id="posterFlag"></span>
      </div>
    </div>
    <div class="card">
      <div class="label">Background</div>
      <img id="bgImg" style="max-height:220px; border-radius:8px; display:none; margin-bottom:8px" />
      <div class="upload-row">
        <input type="file" id="bgFile" accept="image/*">
        <button class="btn" id="importBg">Import</button>
        <button class="btn" id="uploadBg">Upload</button>
        <span id="bgFlag"></span>
      </div>
    </div>
  </div>

  <h3 style="margin-top:18px">Seasons</h3>
  <div id="seasons" class="grid"></div>

  <div id="status"></div>
</main>

<script>
(function(){
  const $ = sel => document.querySelector(sel);
  const urlp = new URLSearchParams(location.search);
  const library = urlp.get('library') || '';
  const ratingKey = urlp.get('ratingKey') || '';
  if (!library || !ratingKey) {
    document.body.innerHTML = "<p style='padding:16px'>Missing library or ratingKey.</p>";
    return;
  }

  $("#back").href = "index.html?lib=" + encodeURIComponent(library);
  const status = $("#status");

  const els = {
    posterFile: $("#posterFile"),
    bgFile: $("#bgFile"),
    uploadPoster: $("#uploadPoster"),
    uploadBg: $("#uploadBg"),
    importPoster: $("#importPoster"),
    importBg: $("#importBg"),
    posterFlag: $("#posterFlag"),
    bgFlag: $("#bgFlag"),
    seasonsDiv: $("#seasons"),
    posterImg: $("#posterImg"),
    bgImg: $("#bgImg"),
  };

  const state = {
    folderName: null,
    plexPosterUrl: null,
    plexBackgroundUrl: null,
    seasons: [] // {index, title, url, urlPlex, exists, plexPosterUrl?}
  };

  function flag(el, exists){
    el.textContent = exists ? "exists" : "missing";
    el.className = exists ? "exists" : "missing";
  }
  function bust(url){ if (!url) return url; return url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(); }

  async function j(url){
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + " -> " + r.status);
    return r.json();
  }

  async function load(){
    status.textContent = "";
    try {
      const data = await j(`/api/show?library=${encodeURIComponent(library)}&ratingKey=${encodeURIComponent(ratingKey)}`);

      // Title
      $("#title").textContent = `${data.title || "Show"}${data.year ? " ("+data.year+")" : ""}`;

      // Remember folder/plex URLs if provided
      state.folderName        = data.folderName;
      state.plexPosterUrl     = data.plexPosterUrl     || data.posterUrlPlex || null;
      state.plexBackgroundUrl = data.plexBackgroundUrl || data.backgroundUrlPlex || null;

      // Flags (if backend provides booleans; else infer from local path presence)
      const posterExists = typeof data.posterExists === "boolean" ? data.posterExists
                          : (data.posterUrl ? data.posterUrl.startsWith("/fileproxy") : false);
      const bgExists     = typeof data.backgroundExists === "boolean" ? data.backgroundExists
                          : (data.backgroundUrl ? data.backgroundUrl.startsWith("/fileproxy") : false);

      flag(els.posterFlag, posterExists);
      flag(els.bgFlag, bgExists);

      // Images: prefer local URLs if present; else Plex
      const posterSrc = data.posterUrl || data.posterUrlPlex || state.plexPosterUrl;
      const bgSrc     = data.backgroundUrl || data.backgroundUrlPlex || state.plexBackgroundUrl;

      if (posterSrc){ els.posterImg.src = bust(posterSrc); els.posterImg.style.display="block"; }
      else { els.posterImg.style.display="none"; }
      if (bgSrc){ els.bgImg.src = bust(bgSrc); els.bgImg.style.display="block"; }
      else { els.bgImg.style.display="none"; }

      // Seasons
      state.seasons = (data.seasons || []).map(s => ({
        index: s.index,
        title: s.title || `Season ${String(s.index).padStart(2,"0")}`,
        url: s.url || s.posterUrl || null,
        urlPlex: s.urlPlex || s.plexPosterUrl || null,
        exists: !!s.exists || (!!s.url && s.url.startsWith("/fileproxy"))
      }));

      renderSeasons();
    } catch (e) {
      status.textContent = String(e);
    }
  }

  function renderSeasons(){
    els.seasonsDiv.innerHTML = "";
    for (const s of state.seasons) {
      const card = document.createElement("div"); card.className = "card";
      const label = document.createElement("div"); label.className="label"; label.textContent = s.title;
      const img = document.createElement("img");
      img.style.maxHeight="200px"; img.style.display = (s.url || s.urlPlex) ? "block" : "none";
      if (s.url) img.src = bust(s.url); else if (s.urlPlex) img.src = bust(s.urlPlex);

      const input = document.createElement("input"); input.type="file"; input.accept="image/*";
      const btn = document.createElement("button"); btn.className="btn"; btn.textContent="Upload";
      const importBtn = document.createElement("button"); importBtn.className="btn"; importBtn.textContent="Import";
      const flagSpan = document.createElement("span"); flag(flagSpan, s.exists);

      // Upload season -> /api/upload_season
      btn.addEventListener("click", async ()=>{
        const f = input.files && input.files[0]; if (!f) return;
        const fd = new FormData();
        fd.append("library", library);
        fd.append("folderName", state.folderName);
        fd.append("season", String(s.index));
        fd.append("file", f);
        status.textContent = "Uploading Season " + s.index + "...";
        try {
          const r = await fetch("/api/upload_season", { method:"POST", body: fd });
          if (!r.ok) throw new Error("HTTP " + r.status);
          await r.json();
          status.textContent = "Done.";
          flag(flagSpan, true);
          await load();
        } catch (err) {
          status.textContent = String(err);
        }
      });

      // Import season -> /api/import/season (pass show ratingKey; include url if we have a Plex URL)
      importBtn.addEventListener("click", async ()=>{
        status.textContent = "Importing Season " + s.index + "...";
        try {
          const fd = new FormData();
          fd.append("library", library);
          fd.append("folderName", state.folderName);
          fd.append("season", String(s.index));
          fd.append("ratingKey", ratingKey);
          if (s.urlPlex) fd.append("url", s.urlPlex);
          const r = await fetch("/api/import/season", { method:"POST", body: fd });
          if (!r.ok) throw new Error("HTTP " + r.status);
          await r.json();
          status.textContent = "Done.";
          await load();
        } catch (err) { status.textContent = String(err); }
      });

      card.appendChild(label);
      const row = document.createElement("div"); row.className="upload-row";
      row.appendChild(img); row.appendChild(input); row.appendChild(btn); row.appendChild(importBtn); row.appendChild(flagSpan);
      card.appendChild(row);
      els.seasonsDiv.appendChild(card);
    }
  }

  // Upload series poster/background -> /api/upload_show (kind = poster|background)
  els.uploadPoster.onclick = async ()=>{
    const f = els.posterFile.files && els.posterFile.files[0]; if (!f) return;
    const fd = new FormData();
    fd.append("library", library);
    fd.append("folderName", state.folderName);
    fd.append("kind", "poster");
    fd.append("file", f);
    status.textContent = "Uploading series poster...";
    try {
      const r = await fetch("/api/upload_show", { method:"POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      await r.json();
      flag(els.posterFlag, true);
      status.textContent = "Done.";
      await load();
    } catch (err) { status.textContent = String(err); }
  };

  els.uploadBg.onclick = async ()=>{
    const f = els.bgFile.files && els.bgFile.files[0]; if (!f) return;
    const fd = new FormData();
    fd.append("library", library);
    fd.append("folderName", state.folderName);
    fd.append("kind", "background");
    fd.append("file", f);
    status.textContent = "Uploading background...";
    try {
      const r = await fetch("/api/upload_show", { method:"POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      await r.json();
      flag(els.bgFlag, true);
      status.textContent = "Done.";
      await load();
    } catch (err) { status.textContent = String(err); }
  };

  // Import series poster/background (use show ratingKey, include URL if API returned one)
  els.importPoster.onclick = async ()=>{
    status.textContent = "Importing series poster...";
    try {
      const fd = new FormData();
      fd.append("library", library);
      fd.append("folderName", state.folderName);
      fd.append("ratingKey", ratingKey);
      if (state.plexPosterUrl) fd.append("url", state.plexPosterUrl);
      const r = await fetch("/api/import/poster", { method:"POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      await r.json();
      flag(els.posterFlag, true);
      status.textContent = "Done.";
      await load();
    } catch (err) { status.textContent = String(err); }
  };

  els.importBg.onclick = async ()=>{
    status.textContent = "Importing background...";
    try {
      const fd = new FormData();
      fd.append("library", library);
      fd.append("folderName", state.folderName);
      fd.append("ratingKey", ratingKey);
      if (state.plexBackgroundUrl) fd.append("url", state.plexBackgroundUrl);
      const r = await fetch("/api/import/background", { method:"POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      await r.json();
      flag(els.bgFlag, true);
      status.textContent = "Done.";
      await load();
    } catch (err) { status.textContent = String(err); }
  };

  document.documentElement.setAttribute("data-theme", localStorage.getItem("kam-theme") || "light");
  load();
})();
</script>
</body>
</html>
