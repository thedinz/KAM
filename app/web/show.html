<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM • Show</title>
<style>
  :root { --bg:#0b0b0f; --fg:#e8e8ee; --muted:#a9a9b5; --card:#15151c; --accent:#5ea1ff; --border:#2a2a36; }
  [data-theme="light"] { --bg:#ffffff; --fg:#11111a; --muted:#4a4a55; --card:#f6f6fb; --accent:#3b82f6; --border:#d7d7e0; }
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu; background:var(--bg); color:var(--fg)}
  header{display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5}
  header h1{font-size:18px; margin:0 8px 0 0}
  a.btn,button.btn{background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:8px 10px; text-decoration:none}
  a.btn:hover,button.btn:hover{border-color:var(--accent)}
  main{padding:16px}
  .row{display:flex; gap:16px; flex-wrap:wrap}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px} overflow:hidden;
  .label{font-size:13px; color:var(--muted); margin-bottom:6px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; margin-top:12px}
  .exists{font-size:12px; color:#4ade80; margin-left:6px}
  .missing{font-size:12px; color:#f59e0b; margin-left:6px}
  .upload-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .upload-row input[type="file"]{flex:1}
  #status{margin-top:10px; color:var(--muted)}
</style>
</head>
<body>
<header>
  <a id="back" class="btn" href="index.html">← Back</a>
  <h1 id="title">Show</h1>
</header>
<main>
  <div class="row">
    <div class="card">
      <div class="label">Series Poster</div>
      <img id="posterImg" style="max-height:220px; border-radius:8px; display:none; margin-bottom:8px" />
      <div class="upload-row">
        <input type="file" id="posterFile" accept="image/*">
        <button class="btn" id="uploadPoster">Upload</button>
        <span id="posterFlag"></span>
      </div>
    </div>
    <div class="card">
      <div class="label">Background</div>
      <img id="bgImg" style="max-height:220px; border-radius:8px; display:none; margin-bottom:8px" />
      <div class="upload-row">
        <input type="file" id="bgFile" accept="image/*">
        <button class="btn" id="uploadBg">Upload</button>
        <span id="bgFlag"></span>
      </div>
    </div>
  </div>

  <h3 style="margin-top:18px">Seasons</h3>
  <div id="seasons" class="grid"></div>

  <div id="status"></div>
</main>

<script>
(function(){
  const $ = sel => document.querySelector(sel);
  const urlp = new URLSearchParams(location.search);
  const library = urlp.get('library') || '';
  const ratingKey = urlp.get('ratingKey') || '';
  if (!library || !ratingKey) {
    document.body.innerHTML = "<p style='padding:16px'>Missing library or ratingKey.</p>";
    return;
  }

  // Update back link so we return to the same library view on index
  const back = $("#back"); back.href = "index.html?lib=" + encodeURIComponent(library);

  const status = $("#status");
  const posterFile = $("#posterFile");
  const bgFile = $("#bgFile");
  const uploadPoster = $("#uploadPoster");
  const uploadBg = $("#uploadBg");
  const posterFlag = $("#posterFlag");
  const bgFlag = $("#bgFlag");
  const seasonsDiv = $("#seasons");

  async function j(url){
    const r = await fetch(url);
    if (!r.ok) throw new Error(url + " -> " + r.status);
    return r.json();
  }

  function flag(el, exists){
    el.textContent = exists ? "exists" : "missing";
    el.className = exists ? "exists" : "missing";
  }

  async function load(){
    status.textContent = "";
    try {
      const data = await j(`/api/show?library=${encodeURIComponent(library)}&ratingKey=${encodeURIComponent(ratingKey)}`);
      $("#title").textContent = `${data.title || "Show"}${data.year ? " ("+data.year+")" : ""}`;
      flag(posterFlag, !!data.posterExists);
      flag(bgFlag, !!data.backgroundExists);
      const pimg = document.getElementById("posterImg");
      const bimg = document.getElementById("bgImg");
      if (data.posterUrl){ pimg.src = data.posterUrl; pimg.style.display="block"; }
      else if (data.posterUrlPlex){ pimg.src = data.posterUrlPlex; pimg.style.display="block"; }
      else { pimg.style.display="none"; }
      if (data.backgroundUrl){ bimg.src = data.backgroundUrl; bimg.style.display="block"; }
      else if (data.backgroundUrlPlex){ bimg.src = data.backgroundUrlPlex; bimg.style.display="block"; }
      else { bimg.style.display="none"; }
      seasonsDiv.innerHTML = "";
      for (const s of (data.seasons || [])) {
        const card = document.createElement("div"); card.className = "card";
        const label = document.createElement("div"); label.className="label"; label.textContent = "Season " + String(s.index).padStart(2, "0");
        const img = document.createElement("img"); img.style.maxHeight="200px"; img.style.display = (s.url || s.urlPlex) ? "block" : "none"; if (s.url) img.src = s.url; else if (s.urlPlex) img.src = s.urlPlex;
        const input = document.createElement("input"); input.type="file"; input.accept="image/*";
        const btn = document.createElement("button"); btn.className="btn"; btn.textContent="Upload";
        const flagSpan = document.createElement("span"); flagSpan.className = s.exists ? "exists" : "missing"; flagSpan.textContent = s.exists ? "exists" : "missing";
        btn.addEventListener("click", async ()=>{
          const f = input.files && input.files[0]; if (!f) return;
          const fd = new FormData();
          fd.append("library", library);
          fd.append("folderName", data.folderName);
          fd.append("season", String(s.index));
          fd.append("file", f);
          status.textContent = "Uploading Season " + s.index + "...";
          try {
            const r = await fetch("/api/upload_season", { method:"POST", body: fd });
            if (!r.ok) throw new Error("HTTP " + r.status);
            await r.json();
            status.textContent = "Done.";
            flagSpan.textContent = "exists"; flagSpan.className="exists"; if (img){ img.src = (s.url || '') + (s.url ? (s.url.includes('?')?'&':'?') + 't='+Date.now() : ''); img.style.display='block'; }
          } catch (err) {
            status.textContent = String(err);
          }
        });
        card.appendChild(label);
        const row = document.createElement("div"); row.className="upload-row";
        row.appendChild(img); row.appendChild(input); row.appendChild(btn); row.appendChild(flagSpan);
        card.appendChild(row);
        seasonsDiv.appendChild(card);
      }

      uploadPoster.onclick = async ()=>{
        const f = posterFile.files && posterFile.files[0]; if (!f) return;
        const fd = new FormData();
        fd.append("library", library);
        fd.append("folderName", data.folderName);
        fd.append("kind", "poster");
        fd.append("file", f);
        status.textContent = "Uploading series poster...";
        try {
          const r = await fetch("/api/upload_show", { method:"POST", body: fd });
          if (!r.ok) throw new Error("HTTP " + r.status);
          await r.json();
          status.textContent = "Done.";
          flag(posterFlag, true);
          const pimg = document.getElementById('posterImg'); pimg.src = (pimg.src || data.posterUrl || '') + (pimg.src.includes('?')?'&':'?') + 't=' + Date.now(); pimg.style.display='block';
        } catch (err) { status.textContent = String(err); }
      };

      uploadBg.onclick = async ()=>{
        const f = bgFile.files && bgFile.files[0]; if (!f) return;
        const fd = new FormData();
        fd.append("library", library);
        fd.append("folderName", data.folderName);
        fd.append("kind", "background");
        fd.append("file", f);
        status.textContent = "Uploading background...";
        try {
          const r = await fetch("/api/upload_show", { method:"POST", body: fd });
          if (!r.ok) throw new Error("HTTP " + r.status);
          await r.json();
          status.textContent = "Done.";
          flag(bgFlag, true);
          const bimg = document.getElementById('bgImg'); bimg.src = (bimg.src || data.backgroundUrl || '') + (bimg.src.includes('?')?'&':'?') + 't=' + Date.now(); bimg.style.display='block';
        } catch (err) { status.textContent = String(err); }
      };

    } catch (e) {
      status.textContent = String(e);
    }
  }

  document.documentElement.setAttribute("data-theme", localStorage.getItem("kam-theme") || "light");
  load();
})();
</script>
</body>
</html>
